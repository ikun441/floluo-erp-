name: floluo-erp
x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/backend.Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg://floluo:${POSTGRES_PASSWORD:?Generate .env first}@postgres:5432/floluo
    APP_ORIGIN: ${APP_ORIGIN:?Set browser origin}
    SECURE_COOKIES: ${SECURE_COOKIES:-true}
    AI_ALLOWED_BASE_URLS: ${AI_ALLOWED_BASE_URLS:-[]}
    AI_API_KEY: ${AI_API_KEY:-}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: floluo
      POSTGRES_DB: floluo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floluo -d floluo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ["${ERP_BIND_ADDRESS:-127.0.0.1}:8080:80"]
    volumes: ["./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
