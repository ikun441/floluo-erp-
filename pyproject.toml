[project]
name = "floluo-erp"
version = "1.0.8"
description = "Single-enterprise offline-first ERP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pwdlib[argon2]>=0.2,<1",
    "websockets>=15,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/erp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]
